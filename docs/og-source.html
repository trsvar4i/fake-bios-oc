<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: Manrope, "Segoe UI", sans-serif; color: #f3f4f7;
    background: radial-gradient(ellipse at 78% 30%, #3b2a8f 0%, transparent 55%), radial-gradient(ellipse at 10% 110%, #5b1a3a 0%, transparent 50%), #0b0b10; }
  .waves { position: absolute; inset: 0; }
  .left { position: absolute; left: 80px; top: 120px; width: 600px; }
  h1 { margin: 26px 0 14px; font-size: 76px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  p { margin: 0; font-size: 28px; line-height: 1.35; color: rgba(243, 244, 247, .72); font-weight: 600; }
  .chips { display: flex; gap: 10px; margin-top: 30px; }
  .chip { padding: 8px 16px; border-radius: 20px; font-size: 18px; font-weight: 800; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .chip.red { color: #ff6b73; background: rgba(227,36,47,.15); box-shadow: inset 0 0 0 1px rgba(227,36,47,.45); font-family: Orbitron, sans-serif; letter-spacing: 1px; font-size: 15px; }
  .screen { position: absolute; right: 70px; top: 110px; width: 400px; height: 300px; border-radius: 20px; overflow: hidden; background: linear-gradient(160deg, #4338ca, #7c3aed 55%, #db2777); box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.15); }
  .screen .win { position: absolute; left: 34px; top: 34px; width: 230px; height: 150px; border-radius: 12px; background: rgba(24,24,30,.9); box-shadow: 0 14px 30px rgba(0,0,0,.4); }
  .screen .win::before { content: ""; position: absolute; left: 30%; right: 30%; top: 0; height: 2px; background: #a5b4fc; }
  .screen .win i { position: absolute; left: 14px; right: 14px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); }
  .perch { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; padding: 7px 9px; border-radius: 14px; background: rgba(20,20,28,.6); }
  .perch span { width: 26px; height: 26px; border-radius: 8px; clip-path: polygon(0 0, 66% 0, 100% 34%, 100% 100%, 0 100%); }
  .bios { position: absolute; right: 70px; top: 430px; width: 400px; height: 86px; border-radius: 14px; background: #111114; box-shadow: inset 0 0 0 1px #5c0d13, 0 20px 50px rgba(0,0,0,.4); font-family: Orbitron, sans-serif; display: flex; align-items: center; gap: 18px; padding: 0 22px; box-sizing: border-box; }
  .bios b { color: #e3242f; font-size: 15px; letter-spacing: 2px; }
  .bios span { color: #fff; font-size: 30px; letter-spacing: 2px; }
  .url { position: absolute; left: 80px; bottom: 54px; font-size: 20px; color: rgba(243,244,247,.45); font-weight: 600; }
</style></head>
<body>
  <div class="left">
    <svg viewBox="0 0 64 64" width="96" height="96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#2f6bff"/></linearGradient></defs>
      <path d="M32 3 57 17.5v29L32 61 7 46.5v-29z" fill="none" stroke="url(#g)" stroke-width="4" stroke-linejoin="round"/><path d="M18 40 L32 22 L46 40 L38 36 L32 44 L26 36 Z" fill="url(#g)"/></svg>
    <h1>Kestrel PC</h1>
    <p>A whole computer in your browser:<br>UEFI BIOS that really matters, POST and Kestrel OS.</p>
    <div class="chips"><span class="chip red">UEFI BIOS</span><span class="chip">Overclock</span><span class="chip">Crash it</span><span class="chip">Fix it</span></div>
  </div>
  <div class="screen">
    <div class="win"><i style="top:40px"></i><i style="top:58px;right:60px"></i><i style="top:76px;right:90px"></i></div>
    <div class="perch">
      <span style="background:linear-gradient(140deg,#a5b4fc,#6366f1)"></span><span style="background:linear-gradient(160deg,#60a5fa,#1d4ed8)"></span><span style="background:linear-gradient(160deg,#fbbf24,#d97706)"></span><span style="background:linear-gradient(160deg,#2dd4bf,#0f766e)"></span><span style="background:linear-gradient(160deg,#3f3f46,#0c0c0e)"></span><span style="background:linear-gradient(160deg,#4ade80,#15803d)"></span><span style="background:linear-gradient(160deg,#facc15,#a16207)"></span>
    </div>
  </div>
  <div class="bios"><b>CPU SPEED</b><span>5.20 GHz</span></div>
  <div class="url">trsvar4i.github.io/fake-bios-oc</div>
</body></html>
